<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - Moniteur de la Pandémie Belge</title>
    <link rel="stylesheet" href="/css/style_statistics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Pour les graphiques -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body>
    <!-- Navigation bar -->
    <header class="nav">
        <nav>
            <ul class="nav-list">
                <li><a href="/html/dashboardFR.html">Accueil</a></li>
                <li><a href="/html/aboutFR.html">À propos</a></li>
                <li><a href="/html/resourcesFR.html">Ressources</a></li>
                <li><a href="/html/statisticsFR.html">Statistiques</a></li>
                <li id="auth-button"></li>
            </ul>
        </nav>
    </header>
    <div class="language-buttons">
        <a href="statisticsEN.html"><button data-lang="en">&#x1f1ec;&#x1f1e7;</button></a>
        <a href="statisticsNL.html"><button data-lang="nl">&#127475;&#127473;</button></a>
        <a href="statisticsFR.html"><button data-lang="fr">&#x1f1eb;&#x1f1f7;</button></a>
        <a href="statisticsDE.html"><button data-lang="de">&#127465;&#127466;</button></a>
    </div>
    <main>
        <section class="statistics">
            <h2>Vue d'ensemble des statistiques</h2>

            <!-- Filters -->
            <div class="filters">
                <label for="filter-regio">Région :</label>
                <select id="filter-regio">
                    <option value="all">Toutes les régions</option>
                    <option value="Brussel">Bruxelles</option>
                    <option value="Vlaams-Brabant">Brabant flamand</option>
                    <option value="Antwerpen">Anvers</option>
                </select>
                <button id="filter-knop">Appliquer le filtre</button>
            </div>

            <!-- Table with statistics -->
            <h3>Vue par région</h3>
            <table id="statistics-table">
                <thead>
                    <tr>
                        <th>Région</th>
                        <th>Nombre total de cas</th>
                        <th>Cas actifs</th>
                        <th>Cas guéris</th>
                        <th>Décès</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <div class="grafiek-container">
                <canvas id="statisticsChart" width="300" height="200"></canvas>
                <canvas id="leeftijdChart" width="300" height="200"></canvas>
                <canvas id="virusChart" width="300" height="200"></canvas>
            </div>
        </section>
    </main>

    <script type="module" src="/javascript/statistics.js"></script>
    <script type="module" src="/javascript/statistics_language.js"></script>
    <script type="module" src="/javascript/highlight_active_page.js"></script>
    <script type="module" src="/javascript/authCheck.js"></script>

</body>
<footer>

</footer>
</html>
