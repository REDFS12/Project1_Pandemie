    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body>
<!-- Navigation bar -->
<header class="nav">
    <nav>
        <ul class="nav-list">
            <li><a href="/html/dashboardDE.html">Startseite</a></li>

            <li><a href="/html/statisticsDE.html">Statistiken</a></li>
            <li id="auth-button"></li>
        </ul>
    </nav>
</header>
    <div class="language-buttons">
        <a href="statisticsEN.html"><button data-lang="en">&#x1f1ec;&#x1f1e7;</button></a>
        <a href="statisticsNL.html"><button data-lang="nl">&#127475;&#127473;</button></a>

        <a href="statisticsDE.html"><button data-lang="de">&#127465;&#127466;</button></a>
    </div>
<main>
    <section class="statistics">
        <h2>Statistikübersicht</h2>

        <!-- Filters -->
        <div class="filters">
            <label for="filter-regio">Region:</label>
            <select id="filter-regio">
                <option value="all">Alle Regionen</option>
                <option value="Brussel">Brüssel</option>
                <option value="Vlaams-Brabant">Flämisch-Brabant</option>
                <option value="Antwerpen">Antwerpen</option>
            </select>
            <button id="filter-knop">Filter anwenden</button>
        </div>

        <!-- Table with statistics -->
        <h3>Ansicht nach Region</h3>
        <table id="statistics-table">
            <thead>
                <tr>
                    <th>Region</th>
                    <th>Gesamtfälle</th>
                    <th>Aktive Fälle</th>
                    <th>Geheilte Fälle</th>
                    <th>Sterbefälle</th>
                </tr>
            </thead>
            <tbody>
               
            </tbody>
        </table>

        <div class="grafiek-container">
            <canvas id="statisticsChart" width="300" height="200"></canvas>
            <canvas id="leeftijdChart" width="300" height="200"></canvas>
            <canvas id="virusChart" width="300" height="200"></canvas>
        </div>
    </section>
</main>

<script type="module" src="/javascript/statistics.js"></script>
<script type="module" src="/javascript/statistics_language.js"></script>
<script type="module" src="/javascript/highlight_active_page.js"></script>
