<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw account - Belgische Pandemie Monitor</title>
    <link rel="stylesheet" href="/css/style_register.css">
</head>
<body>
    <header class="nav">
        <nav>
            <ul class="nav-list">
                <li><a href="/html/dashboardNL.html">Home</a></li>
                <li><a href="/html/aboutNL.html">Over</a></li>
                <li><a href="/html/resourcesNL.html">Bronnen</a></li>
                <li><a href="/html/statisticsNL.html">Statistieken</a></li>
                <li><a href="/html/loginNL.html">Inloggen</a></li>
            </ul>
        </nav>
    </header>

    <div class="forgot-container">
        <h2>Maak je nieuwe account aan</h2>
        <p>Vul de gegevens in voor je nieuwe account!</p>
        <div class="role"> 
            <label for="role">Selecteer rol:</label><br>
            <select id="user-role" class="user-role" required>
                <option value="dokter">Dokter</option>
                <!-- <option value="gebruikers">Gebruiker</option> -->
            </select>
        </div>
        <form id="register-form">
            <input type="email" id="email" placeholder="Vul je e-mail in" required>
            <input type="password" id="password" placeholder="Wachtwoord" required>
            <button type="submit">Account aanmaken</button>
        </form>
        <div class="link-back">
            <a href="/html/dashboardNL.html">Terug naar homepagina</a>
            <a href="/html/loginNL.html">Ga naar inloggen</a>
        </div>
    </div>
    <script src="/javascript/register.js" type="module"></script>
</body>
<footer>
    <p>&copy; 2025 Belgische Pandemie Monitor. Alle rechten voorbehouden.</p>
</footer>
</html>
