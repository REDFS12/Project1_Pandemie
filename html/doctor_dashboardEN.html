<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Belgian Pandemic Monitor</title>
    <link rel="stylesheet" href="/css/style_doctor_dashboard.css">
    <!-- Chart.js import -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<section class="headerSection">
    <header class="nav">
        <nav>
            <ul class="nav-list">
                <li><a href="/html/dashboardEN.html">Home</a></li>
                <li><a href="/html/aboutEN.html">About</a></li>
                <li><a href="/html/resourcesEN.html">Resources</a></li>
                <li><a href="/html/statisticsEN.html">Statistics</a></li>
                <li id="auth-button"></li>

            </ul>
        </nav>
    </header>
    <div class="language-buttons">
        <a href="doctor_dashboardEN.html"><button data-lang="en">&#x1f1ec;&#x1f1e7;</button></a>
        <a href="doctor_dashboardNL.html"><button data-lang="nl">&#127475;&#127473;</button></a>
        <a href="doctor_dashboardFR.html"><button data-lang="fr">&#x1f1eb;&#x1f1f7;</button></a>
        <a href="doctor_dashboardDE.html"><button data-lang="de">&#127465;&#127466;</button></a>
    </div>
<main>
    <section class="information">
        <h2>Important Information</h2>
        <ul class="main-list">
            <li>Total cases: <span id="total_cases"></span></li>
            <li>Active cases: <span id="aantal_actieve"></span></li>
            <li>Recovered cases: <span id="aantal_hersteld"></span></li>
            <li>Deaths: <span id="aantal_overleden"></span></li>
        </ul>
    </section>

<hr>

<section class="meldingen">
    <h2>Report a new infection:</h2>
    <form id="besmetting-form">
        <div class="infoPersoon">
            <label>Region:
                <select id="regio">
                    <option value="Brussel">Brussels</option>
                    <option value="Vlaams-Brabant">Flemish Brabant</option>
                    <option value="Antwerpen">Antwerp</option>
                </select>
            </label><br>

            <label>Work Location:
                <input type="text" id="werkLocatie" required>
            </label><br>

            <label>Age:
                <input type="number" id="leeftijd" required>
            </label><br>

            <label>Household size:
                <input type="number" id="gezinGrootte" required>
            </label><br>

            <label>Gender:
                <select id="geslacht">
                    <option value="man">Male</option>
                    <option value="vrouw">Female</option>
                </select required>
            </label><br>
        </div>

        <div class="infoVirus">
            <label>Virus type:
                <select id="virusType" required> 
                    <option value="Covid">Covid</option>
                    <option value="Grippe">Flu</option>
                    <option value="Malaria">Malaria</option>
                </select>
            </label><br>

            <label>Date of infection:
                <input type="date" id="datumBesmetting" required>
            </label><br>

            <label>Date of entry:
                <input type="date" id="ingaveDatum" required>
            </label><br>

            <label>Date of recovery:
                <input type="date" id="genezingDatum">
            </label><br>

            <label>Vaccination status:
                <select id="statusVaccinatie" required>
                    <option value="gevaccineerd">Vaccinated</option>
                    <option value="nietGevaccineerd">Not vaccinated</option>
                </select>
            </label>
        </div> 

        <button class="button" type="submit">Save</button>
    </form>
</section>

<section class="chartSection">
    <h2>Infections per Region:</h2>
    <canvas id="regioChart" style="width: 300px; height: 300px;"></canvas>
</section>

</main>

<script type="module" src="/javascript/doctor_dashboard.js"></script>
<script type="module" src="/javascript/import.js"></script>
<script type="module" src="/javascript/doctor_language.js"></script>
<script type="module" src="/javascript/authCheck.js"></script>

<footer>
    <p>&copy; 2025 Belgian Pandemic Monitor. All rights reserved.</p>
</footer>

</body>



</html>
