<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arzt-Dashboard - Belgischer Pandemie-Monitor</title>
    <link rel="stylesheet" href="/css/style_doctor_dashboard.css">
    <!-- Chart.js import -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<section class="headerSection">
    <header class="nav">
        <nav>
            <ul class="nav-list">
                <li><a href="/html/dashboardDE.html">Startseite</a></li>
                <li><a href="/html/aboutDE.html">Über uns</a></li>
                <li><a href="/html/resourcesDE.html">Ressourcen</a></li>
                <li><a href="/html/statisticsDE.html">Statistiken</a></li>
                <li id="auth-button"></li>
            </ul>
        </nav>
    </header>
    <div class="language-buttons">
        <a href="doctor_dashboardEN.html"><button data-lang="en">&#x1f1ec;&#x1f1e7;</button></a>
        <a href="doctor_dashboardNL.html"><button data-lang="nl">&#127475;&#127473;</button></a>
        <a href="doctor_dashboardFR.html"><button data-lang="fr">&#x1f1eb;&#x1f1f7;</button></a>
        <a href="doctor_dashboardDE.html"><button data-lang="de">&#127465;&#127466;</button></a>
    </div>
<main>
    <section class="information">
        <h2>Wichtige Informationen</h2>
        <ul class="main-list">
            <li>Gesamtfälle: <span id="total_cases"></span></li>
            <li>Aktive Fälle: <span id="aantal_actieve"></span></li>
            <li>Genesene Fälle: <span id="aantal_hersteld"></span></li>
            <li>Todesfälle: <span id="aantal_overleden"></span></li>
        </ul>
    </section>

<hr>

<section class="meldingen">
    <h2>Neue Infektion melden:</h2>
    <form id="besmetting-form">
        <div class="infoPersoon">
            <label>Region:
                <select id="regio">
                    <option value="Brussel">Brüssel</option>
                    <option value="Vlaams-Brabant">Flämisch-Brabant</option>
                    <option value="Antwerpen">Antwerpen</option>
                </select>
            </label><br>

            <label>Arbeitsort:
                <input type="text" id="werkLocatie" required>
            </label><br>

            <label>Alter:
                <input type="number" id="leeftijd" required>
            </label><br>

            <label>Haushaltsgröße:
                <input type="number" id="gezinGrootte" required>
            </label><br>

            <label>Geschlecht:
                <select id="geslacht">
                    <option value="man">Männlich</option>
                    <option value="vrouw">Weiblich</option>
                </select required>
            </label><br>
        </div>

        <div class="infoVirus">
            <label>Virustyp:
                <select id="virusType" required> 
                    <option value="Covid">Covid</option>
                    <option value="Grippe">Grippe</option>
                    <option value="Malaria">Malaria</option>
                </select>
            </label><br>

            <label>Infektionsdatum:
                <input type="date" id="datumBesmetting" required>
            </label><br>

            <label>Eintragsdatum:
                <input type="date" id="ingaveDatum" required>
            </label><br>

            <label>Genesungsdatum:
                <input type="date" id="genezingDatum">
            </label><br>

            <label>Impfstatus:
                <select id="statusVaccinatie" required>
                    <option value="gevaccineerd">Geimpft</option>
                    <option value="nietGevaccineerd">Nicht geimpft</option>
                </select>
            </label>
        </div> 

        <button class="button" type="submit">Speichern</button>
    </form>
</section>

<section class="chartSection">
    <h2>Infektionen pro Region:</h2>
    <canvas id="regioChart" style="width: 300px; height: 300px;"></canvas>
</section>

</main>

<script type="module" src="/javascript/doctor_dashboard.js"></script>
<script type="module" src="/javascript/import.js"></script>
<script type="module" src="/javascript/doctor_language.js"></script>
<script type="module" src="/javascript/authCheck.js"></script>

<footer>
    <p>&copy; 2025 Belgischer Pandemie-Monitor. Alle Rechte vorbehalten.</p>
</footer>

</body>
</html>
