<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Belgian Pandemic Monitor </title>
    <link rel="stylesheet" href="/css/style_login.css">
</head>
<body>
    <header class="nav">
        <nav>
            <ul class="nav-list">
                <li><a href="/html/dashboardEN.html">Home</a></li>
                <li><a href="/html/aboutEN.html">About</a></li>
                <li><a href="/html/resourcesEN.html">Resources</a></li>
                <li><a href="/html/statisticsEN.html">Statistics</a></li>
                <li><a href="/html/loginEN.html">Sign in</a></li>
            </ul>
        </nav>
</header>

    <div class="language-buttons">
        <a href="loginEN.html"><button data-lang="en">&#x1f1ec;&#x1f1e7;</button></a>
        <a href="loginNL.html"><button data-lang="nl">&#127475;&#127473;</button></a>
        <a href="loginFR.html"><button data-lang="fr">&#x1f1eb;&#x1f1f7;</button></a>
        <a href="loginDE.html"><button data-lang="de">&#127465;&#127466;</button></a>
    </div>

    <div class="login-container">
        <h2 class="login-title">Login</h2>
        
        <div class="role"> 
            <label class="title-role" for="role">Select Role:</label><br>
            <select id="user-role" class="user-role" required>
                <option value="dokter">Doctor</option>
            </select>
        </div>
        
        <form id="login-form">
            <input type="email" id="login-email" placeholder="E-mail" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="login-options">
            <a href="/html/registerEN.html" class="register">Create an account</a>
            <a href="/html/forgot_passwordEN.html" class="forgot">Forgot password?</a>
            <a href="/html/dashboardEN.html" class="back-home">Back to home page</a>
        </div>
    </div>
    <script src="/javascript/login.js" type="module"></script>   
    <script type="module" src="/javascript/login_language.js"></script> 
    <script type="module" src="/javascript/highlight_active_page.js"></script>
</body>
<footer>

</footer>

</html>
